<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polarity & Maturity Model</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #graph { width: 100%; height: 600px; border: 1px solid #ccc; }
        #loading { text-align: center; margin: 20px; display: block; }
        form { margin-bottom: 20px; }
        input[type="text"] { width: 200px; margin-right: 10px; }
        input[type="range"] { width: 200px; }
        button { padding: 8px 16px; margin-right: 10px; }
        #state { margin-top: 10px; font-style: italic; }
        #iteration { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Polarity & Maturity Model</h1>
    <h5>Create Polarity Graph</h5>
    <p>3 3 0.5</p>
    <hr>

    <!-- Polarity Pair Form -->
    <form id="polarityForm">
        <label for="light">Light Aspect:</label>
        <input type="text" id="light" name="light" placeholder="e.g., good" required>
        <label for="shadow">Shadow Aspect:</label>
        <input type="text" id="shadow" name="shadow" placeholder="e.g., bad" required>
        <button type="submit">Add Pair</button>
    </form>

    <!-- Handles: Sliders -->
    <div id="controls" style="display: none;">
        <label for="maturity">Maturity (1-5):</label>
        <input type="range" id="maturity" name="maturity" min="1" max="5" value="3" step="1">
        <span id="maturityValue">3</span><br>
        <label for="fear">Fear (0-1):</label>
        <input type="range" id="fear" name="fear" min="0" max="1" value="0.5" step="0.1">
        <span id="fearValue">0.5</span><br>
        <label for="extremity">Extremity (0-1):</label>
        <input type="range" id="extremity" name="extremity" min="0" max="1" value="0.5" step="0.1">
        <span id="extremityValue">0.5</span><br>
        <button id="stepIterations">Step Through Iterations</button>
    </div>

    <div id="loading">Loading...</div>
    <div id="graph" style="display: none;"></div>
    <div id="state"></div>
    <div id="iteration"></div>

    <script>
        let network;
        let nodes = new vis.DataSet([]);
        let edges = new vis.DataSet([]);
        let currentPair = { light: '', shadow: '' };
        let iterations = [];
        let currentIteration = 0;

        // Initialize graph
        window.onload = function() {
            const container = document.getElementById('graph');
            const data = { nodes: nodes, edges: edges };
            const options = {
                manipulation: { enabled: true },
                physics: { enabled: true, repulsion: { nodeDistance: 200 } },
                nodes: { shape: 'dot', font: { size: 14 } },
                edges: { smooth: false, arrows: 'to' },
                interaction: { hover: true, zoomView: true }
            };
            network = new vis.Network(container, data, options);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('graph').style.display = 'block';
        };

        // Add Polarity Pair
        document.getElementById('polarityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const light = document.getElementById('light').value.trim();
            const shadow = document.getElementById('shadow').value.trim();
            if (!light || !shadow) return;

            currentPair = { light, shadow };
            document.getElementById('loading').style.display = 'block';
            document.getElementById('controls').style.display = 'block';

            fetch('/add_polarity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ light, shadow })
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(data => {
                if (data.error) throw new Error(data.error);
                nodes.update([
                    { id: light, label: light, polarity: 'light', maturity: data.maturity_light, color: '#00ff00' },
                    { id: shadow, label: shadow, polarity: 'shadow', maturity: data.maturity_shadow, color: '#ff0000' }
                ]);
                edges.update([{ from: light, to: shadow, label: `Tension: ${data.tension.toFixed(2)}`, color: '#0000ff', width: 1 }]);
                iterations = data.iterations;
                currentIteration = 0;
                document.getElementById('state').innerHTML = data.state;
                document.getElementById('iteration').innerHTML = '';
                document.getElementById('loading').style.display = 'none';
            })
            .catch(error => {
                console.error('Add polarity error:', error);
                document.getElementById('loading').innerHTML = `Error: ${error.message}`;
            });
        });

        // Update sliders' displayed values and graph
        ['maturity', 'fear', 'extremity'].forEach(id => {
            const slider = document.getElementById(id);
            const valueSpan = document.getElementById(id + 'Value');
            slider.addEventListener('input', () => {
                valueSpan.textContent = slider.value;
                updateGraph();
            });
        });

        // Update graph with slider values
        function updateGraph() {
            if (!currentPair.light || !currentPair.shadow) return;
            const maturity = parseFloat(document.getElementById('maturity').value);
            const fear = parseFloat(document.getElementById('fear').value);
            const extremity = parseFloat(document.getElementById('extremity').value);

            document.getElementById('loading').style.display = 'block';
            fetch('/update_polarity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ light: currentPair.light, shadow: currentPair.shadow, maturity, fear, extremity })
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(data => {
                if (data.error) throw new Error(data.error);
                nodes.update([
                    { 
                        id: currentPair.light, 
                        label: currentPair.light, 
                        polarity: data.polarity_light, 
                        maturity: data.maturity_light, 
                        color: data.polarity_light === 'light' ? (data.fear > 0.7 ? '#ff9999' : '#00ff00') : '#ff0000',
                        size: data.maturity_light * 10
                    },
                    { 
                        id: currentPair.shadow, 
                        label: currentPair.shadow, 
                        polarity: data.polarity_shadow, 
                        maturity: data.maturity_shadow, 
                        color: data.polarity_shadow === 'shadow' ? (data.fear > 0.7 ? '#ff9999' : '#ff0000') : '#00ff00',
                        size: data.maturity_shadow * 10
                    }
                ]);
                edges.update([{
                    from: currentPair.light, 
                    to: currentPair.shadow, 
                    label: `Tension: ${data.tension.toFixed(2)}`,
                    color: data.extremity > 0.7 ? '#ff6600' : '#0000ff',
                    width: data.extremity * 5 + 1
                }]);
                iterations = data.iterations;
                currentIteration = 0;
                document.getElementById('state').innerHTML = data.state;
                document.getElementById('iteration').innerHTML = '';
                document.getElementById('loading').style.display = 'none';
            })
            .catch(error => {
                console.error('Update polarity error:', error);
                document.getElementById('loading').innerHTML = `Error: ${error.message}`;
            });
        }

        // Step through iterations
        document.getElementById('stepIterations').addEventListener('click', function() {
            if (!iterations.length || currentIteration >= iterations.length) return;
            const iter = iterations[currentIteration];
            document.getElementById('iteration').innerHTML = `Iteration ${iter.iteration}: ${iter.changes.join('; ')}`;
            // Animate edge pulse for changes
            if (iter.changes.length) {
                edges.update([{ 
                    from: currentPair.light, 
                    to: currentPair.shadow, 
                    color: { color: '#ff0000', highlight: '#ff0000' },
                    width: 5
                }]);
                setTimeout(() => {
                    edges.update([{ 
                        from: currentPair.light, 
                        to: currentPair.shadow, 
                        color: { color: iterations[currentIteration].extremity > 0.7 ? '#ff6600' : '#0000ff' },
                        width: iterations[currentIteration].extremity * 5 + 1
                    }]);
                }, 500);
            }
            currentIteration = (currentIteration + 1) % iterations.length;
        });

        // Hover tooltips
        network.on('hoverNode', function(params) {
            const node = nodes.get(params.node);
            let tooltip = `Node: ${node.label} - Polarity: ${node.polarity}, Maturity: ${node.maturity}`;
            const flips = iterations.flatMap(iter => iter.changes.filter(c => c.includes(node.label)));
            if (flips.length) tooltip += `<br>Flip history: ${flips.join('; ')}`;
            console.log(tooltip);
        });
    </script>
</body>
</html>
